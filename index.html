// 図の座標: 名 面(f前/b後) 正中からの距離 y
const CO={};
`百会 f 0 6

率谷 f 17 12
中府 f 30 58

関元 f 0 127
肩髃 f 40 54

列欠 f 56 106
太淵 f 56 119
神門 f 47 119
梁丘 f 26 178

足三里 f 25 212

公孫 f 14 246

const MER={LU:"肺経",LI:"大腸経",ST:"胃経",SP:"脾経",HT:"心経",SI:"小腸経",BL:"膀胱経",KI:"腎経",PC:"心包経",TE:"三焦経",GB:"胆経",LR:"肝経",GV:"督脈",CV:"任脈",EX:"奇穴"};
let PT,SY,ZH,TG,cur;
const L=k=>cur[k].split("\n").map(s=>s.trim()).filter(Boolean);
function parse(){PT={};TG={};
 L("pt").forEach(l=>{const a=l.split("|");PT[a[0]]={n:a[0],r:a[1]||"",c:a[2]||"",loc:a[3]||"",note:a[4]||""}});
 L("tg").forEach(l=>{const a=l.split("|");TG[a[0]]=a[1]||""});
 SY=L("sy").map(l=>{const a=l.split("|");return{n:a[0],syn:a[1]||"",pts:(a[2]||"").split(",").filter(Boolean),sets:(a[3]||"").split(";").filter(Boolean).map(s=>{const b=s.split(":");return{n:b[0],p:(b[1]||"").split("+").filter(Boolean),aim:b[2]||""}})}});
 ZH=L("zh").map(l=>{const a=l.split("|");return{n:a[0],syn:a[1]||"",sig:a[2]||"",tx:a[3]||"",pts:(a[4]||"").split(",").filter(Boolean)}})}
function load(){let o={};try{o=JSON.parse(localStorage.getItem("tsd")||"{}")}catch(e){}cur=Object.assign({},D,o);parse()}
const $=s=>document.querySelector(s);
let memo={};try{memo=JSON.parse(localStorage.getItem("tsm")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("tsm",JSON.stringify(memo))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const kana=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).toLowerCase();
const mer=c=>MER[c.slice(0,2)]||"";
const tg=n=>TG[n]||"";
let st={tab:1,sym:null,zh:null,pt:null,q:"",m:"",g:"",rc:0};
const chip=n=>`<button class="chip" data-p="${n}">${n}</button>`;
const pcard=n=>{const p=PT[n];return p?`<div class="card" data-p="${n}"><span class="nm">${n}</span> <small>${p.r}</small><span class="tag">${p.c}</span><span class="tag">${mer(p.c)}</span>${tg(n)?`<span class="tag">${tg(n)}</span>`:""}<div class="sub">${p.loc}</div>${p.note?`<div class="sub" style="color:var(--warn)">⚠ ${p.note}</div>`:""}</div>`:""};
function body(pts){
 const on=pts.filter(n=>CO[n]),off=pts.filter(n=>!CO[n]&&PT[n]);
 const limb=(x1,y1,x2,y2,w)=>`<line class="lo" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w+3}"/><line class="li" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}"/>`;
 let s=`<svg viewBox="0 0 420 268" width="100%" style="max-width:520px;display:block;margin:8px auto" role="img" aria-label="経穴の位置(目安)" stroke-linecap="round">`;
 [["f",100,"前面"],["b",320,"背面"]].forEach(([v,cx,lb])=>{
  s+=limb(cx-22,134,cx-22,250,24)+limb(cx+22,134,cx+22,250,24)+limb(cx-38,56,cx-60,138,14)+limb(cx+38,56,cx+60,138,14);
  s+=`<rect class="sh" x="${cx-38}" y="46" width="76" height="90" rx="16"/><circle class="sh" cx="${cx}" cy="24" r="17"/><text class="cp" x="${cx}" y="264" text-anchor="middle">${lb}</text>`;
  on.forEach(n=>CO[n].filter(c=>c[0]==v).forEach(([,dx,y])=>{
   (dx?[-dx,dx]:[0]).forEach(o=>{s+=`<circle cx="${cx+o}" cy="${y}" r="3.4" fill="#d1493a" stroke="#fff" stroke-width="1"/>`});
   s+=`<text class="lb" x="${cx+dx+5}" y="${y+3}">${n}</text>`}))});
 return s+`</svg><div class="sub">${off.length?"図未登録: "+off.join("・")+"。":""}位置は目安です。取穴は骨度・触診で確認してください。</div>`}
function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.className=b.dataset.t==st.tab?"on":"");
 const m=$("#main"),inner=st.sym||st.zh||st.pt;
 $("#q").style.display=(inner||st.tab==4)?"none":"block";
 $("#q").placeholder=["","症状を入力(例: かたこり)","証・所見を入力(例: 脾虚、冷え)","穴名・読み・経絡・要穴で検索(例: 胃経、原穴)"][st.tab];
 const q=kana(st.q.trim());
 if(st.pt){const p=PT[st.pt],us=SY.filter(s=>s.pts.includes(p.n)),zs=ZH.filter(z=>z.pts.includes(p.n));
  m.innerHTML=`<button class="back" data-back>‹ 戻る</button><div class="nm" style="font-size:28px">${p.n}</div><div class="sub">${p.r} ・ ${p.c} ・ ${mer(p.c)}</div>${tg(p.n)?`<div class="chips"><span class="tag" style="margin:0">${tg(p.n)}</span></div>`:""}
  <h2>位置</h2><div>${p.loc}</div>${p.note?`<div class="warn">⚠ ${p.note}</div>`:""}${body([p.n])}
  <h2>登録されている症状</h2><div class="chips">${us.map(s=>`<button class="chip" data-s="${s.n}">${s.n}</button>`).join("")||"<span class=sub>なし</span>"}</div>
  <h2>関連する証</h2><div class="chips">${zs.map(z=>`<button class="chip" data-z="${z.n}">${z.n}</button>`).join("")||"<span class=sub>なし</span>"}</div>
  <h2>自分用メモ(刺鍼の深さ・灸の壮数・反応など)</h2><textarea id="memo">${esc(memo[p.n]||"")}</textarea>`;
  $("#memo").oninput=e=>{memo[p.n]=e.target.value;save()};return}
 if(st.sym){const s=SY.find(x=>x.n==st.sym);
  m.innerHTML=`<button class="back" data-back>‹ 症状一覧</button><div class="nm" style="font-size:26px">${s.n}</div>
  <h2>配穴の例</h2>${s.sets.map(x=>`<div class="set"><b>${x.n}</b><div class="chips">${x.p.map(chip).join("")}</div><div class="sub">${x.aim}</div></div>`).join("")}
  ${body(s.pts)}<h2>関連する経穴</h2><div class="list">${s.pts.map(pcard).join("")}</div>`;return}
 if(st.zh){const z=ZH.find(x=>x.n==st.zh);
  m.innerHTML=`<button class="back" data-back>‹ 証一覧</button><div class="nm" style="font-size:26px">${z.n}</div><div class="sub">別名: ${z.syn}</div>
  <h2>主な所見</h2><div>${z.sig}</div><h2>治法</h2><div>${z.tx}</div><h2>配穴例</h2><div class="chips">${z.pts.map(chip).join("")}</div>
  ${body(z.pts)}<h2>経穴</h2><div class="list">${z.pts.map(pcard).join("")}</div>`;return}
 if(st.tab==1){const r=SY.filter(s=>!q||kana(s.n+","+s.syn).includes(q));
  m.innerHTML=`<div class="list">${r.map(s=>`<div class="card" data-s="${s.n}"><span class="nm">${s.n}</span><div class="sub">${s.pts.slice(0,5).join("・")}</div></div>`).join("")||"<p class=sub>該当なし。別の言い方で試してください。</p>"}</div>`}
 else if(st.tab==2){const r=ZH.filter(z=>!q||kana(z.n+","+z.syn+","+z.sig).includes(q));
  m.innerHTML=`<div class="list">${r.map(z=>`<div class="card" data-z="${z.n}"><span class="nm">${z.n}</span> <small>${z.tx}</small><div class="sub">${z.sig}</div></div>`).join("")||"<p class=sub>該当なし</p>"}</div>`}
 else if(st.tab==3){const gs=[["原穴","原穴"],["絡穴","絡穴"],["郄穴","郄穴"],["募穴","募穴"],["背部兪穴","背部兪穴"],["下合穴","下合穴"],["八会穴","八会穴"],["八脈交会穴","八脈交会穴"],["井穴","(井"],["滎穴","(滎"],["兪穴(五兪)","(兪"],["経穴(五兪)","(経"],["合穴","(合"],["木","・木"],["火","・火"],["土","・土"],["金","・金"],["水","・水"]];
  const r=Object.values(PT).filter(p=>(!q||kana([p.n,p.r,p.c,mer(p.c),tg(p.n)].join(",")).includes(q))&&(!st.m||p.c.slice(0,2)==st.m)&&(!st.g||tg(p.n).includes(st.g)));
  m.innerHTML=`<div class="scr">${Object.keys(MER).map(k=>`<button class="chip${st.m==k?" on":""}" data-m="${k}">${MER[k]}</button>`).join("")}</div><div class="scr">${gs.map(([a,b])=>`<button class="chip${st.g==b?" on":""}" data-g="${b}">${a}</button>`).join("")}</div><div class="sub">${r.length}穴</div><div class="list">${r.map(p=>pcard(p.n)).join("")||"<p class=sub>該当なし</p>"}</div>`}
 else{m.innerHTML=`<p class="sub">1行1件、区切りは「|」。保存するとこの端末に残ります。</p>`+[["pt","経穴(名|読み|記号|位置|注意)"],["sy","症状(名|同義語,..|穴,..|配穴名:穴+穴:狙い;..)"],["zh","証(名|別名|所見|治法|穴,..)"],["tg","要穴区分(穴|区分,..)"]].map(([k,t])=>`<h2>${t}</h2><textarea class="ed" data-k="${k}">${esc(cur[k])}</textarea>`).join("")+`<div class="chips" style="margin-top:12px"><button class="chip" data-save>保存</button><button class="chip" data-reset>初期データに戻す</button></div><h2>バックアップ(データとメモ)</h2><div class="chips"><button class="chip" data-exp>書き出す</button><button class="chip" data-imp>読み込む</button></div><textarea id="bk" placeholder="書き出し結果がここに出ます。読み込むときは貼り付けて「読み込む」"></textarea><div id="msg" class="sub"></div>`}
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-p],[data-s],[data-z],[data-t],[data-m],[data-g],[data-back],[data-save],[data-reset],[data-exp],[data-imp]");if(!t)return;
 const d=t.dataset,msg=s=>{$("#msg").textContent=s};
 if(d.save!==undefined){document.querySelectorAll(".ed").forEach(x=>cur[x.dataset.k]=x.value);try{localStorage.setItem("tsd",JSON.stringify(cur))}catch(err){}parse();msg("保存しました");return}
 if(d.reset!==undefined){if(!st.rc){st.rc=1;msg("もう一度押すと初期化します(メモは残ります)");return}st.rc=0;try{localStorage.removeItem("tsd")}catch(err){}load();render();return}
 if(d.exp!==undefined){const s=JSON.stringify({d:cur,memo});$("#bk").value=s;try{navigator.clipboard.writeText(s)}catch(err){}msg("書き出しました。全選択してコピーし、メモ帳などに保存してください");return}
 if(d.imp!==undefined){try{const o=JSON.parse($("#bk").value);cur=Object.assign({},D,o.d);memo=o.memo||{};save();localStorage.setItem("tsd",JSON.stringify(cur));parse();render();msg("読み込みました")}catch(err){msg("読み込めませんでした")}return}
 if(d.t){st={tab:+d.t,sym:null,zh:null,pt:null,q:"",m:"",g:"",rc:0};$("#q").value=""}
 else if(d.back!==undefined){if(st.pt)st.pt=null;else{st.sym=null;st.zh=null}}
 else if(d.p)st.pt=d.p;
 else if(d.s){st.pt=null;st.zh=null;st.tab=1;st.sym=d.s}
 else if(d.z){st.pt=null;st.sym=null;st.tab=2;st.zh=d.z}
 else if(d.m!==undefined)st.m=st.m==d.m?"":d.m;
 else if(d.g!==undefined)st.g=st.g==d.g?"":d.g;
 render();if(d.m===undefined&&d.g===undefined)window.scrollTo(0,0)});
$("#q").oninput=e=>{st.q=e.target.value;render()};
load();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
